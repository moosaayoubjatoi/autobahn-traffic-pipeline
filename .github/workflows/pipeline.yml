# Runs the full pipeline every 3 hours on GitHub's servers.
#
# The database is kept on a separate branch called "data" that holds only
# autobahn.duckdb (one commit, replaced each run), so the main branch stays small.
# Each run: download the current database -> add new snapshots -> rebuild dbt
# models + tests -> upload the database again. If a test fails, the run fails
# and GitHub emails the repo owner.

name: pipeline

on:
  schedule:
    - cron: "15 */3 * * *"   # minute 15 of every 3rd hour (UTC)
  workflow_dispatch:          # allows a manual run from the Actions tab

permissions:
  contents: write             # needed to push the data branch

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Download current database from the data branch
        run: |
          if git fetch --depth 1 origin data; then
            git show origin/data:autobahn.duckdb > data/autobahn.duckdb
            echo "Restored database: $(du -h data/autobahn.duckdb | cut -f1)"
          else
            echo "No data branch yet: starting a new database."
          fi

      - name: Run pipeline (extract -> load -> dbt build)
        run: python -m pipeline.run

      - name: Upload database to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/data-branch && cp data/autobahn.duckdb /tmp/data-branch/
          cd /tmp/data-branch
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autobahn.duckdb
          git commit -q -m "Data update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
